type Query {
  "The scores for 1 town. Each row of the screen asks for 1 field."
  activities(location: LocationInput!): Activities!
}

"The town from Geocoding. The backend checks the values."
input LocationInput {
  "Geocoding id, for the Apollo cache and the logs"
  id: ID!
  "From −90 to 90"
  latitude: Float!
  "From −180 to 180"
  longitude: Float!
  "m, from −500 to 9,000. For the Forecast API."
  elevation: Float
  "0 or more. For the town size hint. null if Geocoding has no data."
  population: Int
  "PPLC = capital. For the town size hint."
  featureCode: String
}

type Activities {
  "The same as LocationInput.id"
  id: ID!
  skiing: ActivityResult!
  surfing: ActivityResult!
  outdoor: ActivityResult!
  indoor: IndoorResult!
}

enum ActivityStatus {
  OK
  NOT_APPLICABLE
}

enum Label {
  POOR
  FAIR
  MODERATE
  GOOD
  EXCELLENT
}

enum Confidence {
  HIGH
  MEDIUM
  LOW
}

type ActivityResult {
  status: ActivityStatus!
  "For example, NO_SEA_NEARBY"
  notApplicableReason: Explanation
  "null when NOT_APPLICABLE or when all days ended"
  weeklyScore: Int
  weeklyLabel: Label
  "7 items. Empty when NOT_APPLICABLE."
  days: [DayScore!]!
  summary: [Explanation!]!
  notes: [Explanation!]!
}

type DayScore {
  "YYYY-MM-DD, local date of the town"
  date: String!
  score: Int!
  label: Label!
  confidence: Confidence!
  ended: Boolean!
  scoreBeforeGates: Int!
  factors: [Factor!]!
  "Only the gates with an effect"
  gates: [Explanation!]!
  adjustments: [Adjustment!]!
  "The 1–2 factors that decrease the score most"
  reasons: [Explanation!]!
  "Notes for this day only (UV, wind direction, mountain conditions)"
  notes: [Explanation!]!
}

type Factor {
  key: ExplanationKey!
  value: Float
  "m, cm, °C, km/h or %"
  unit: String
  "For factors with 2 inputs (skiing sky, outdoor precipitation)"
  params: JSON
  "0–1"
  subScore: Float!
  "0–1"
  weight: Float!
  "weight × subScore × 100"
  points: Float!
}

type Adjustment {
  key: ExplanationKey!
  points: Int!
  params: JSON
}

type Explanation {
  key: ExplanationKey!
  "The values for the text template"
  params: JSON
  "Dates (YYYY-MM-DD), for weekly summary items"
  days: [String!]
}

enum IndoorLevel {
  RECOMMENDED
  GOOD_ALTERNATIVE
  SAVE_FOR_LATER
}

type IndoorResult {
  "Recommended on 3 of 7 days"
  recommendedDays: Int!
  days: [IndoorDay!]!
  summary: [Explanation!]!
  "TOWN_SIZE_NO_DATA when the population is null"
  townSize: Explanation!
}

type IndoorDay {
  date: String!
  level: IndoorLevel!
  ended: Boolean!
  outdoorScore: Int!
  "The outdoor gate or the worst factor"
  mainCause: Explanation
  "TRAVEL_HINT, BUSY_HINT"
  hints: [Explanation!]!
}

"Any JSON value. The values for a text template (params)."
scalar JSON

"""
The keys for all factors, gates, adjustments, notes, hints and summary items.
The frontend has 1 text template for each key.
"""
enum ExplanationKey {
  # Skiing factors
  SNOW_BASE
  FRESH_SNOW
  SKI_TEMPERATURE
  SKI_WIND
  SKI_SKY
  # Surfing factors
  SWELL_HEIGHT
  SWELL_PERIOD
  SURF_WIND_SPEED
  WAVE_QUALITY
  WATER_COMFORT
  # Outdoor factors
  PRECIPITATION
  THERMAL_COMFORT
  OUTDOOR_SKY
  OUTDOOR_WIND
  # Gates
  NO_SNOW_BASE_GATE
  FREEZING_RAIN_GATE
  RAIN_ON_SNOW_GATE
  THUNDERSTORM_GATE
  LARGE_SWELL_GATE
  STRONG_WIND_GATE
  EXTREME_TEMPERATURE_GATE
  STRONG_GUSTS_GATE
  HEAVY_RAIN_GATE
  HIGH_WIND_GATE
  # Adjustments
  ONSHORE_WIND
  OFFSHORE_WIND
  FOG
  # Notes
  WIND_DIRECTION
  COAST_DIRECTION_UNCLEAR
  TERRAIN_UNAVAILABLE
  MOUNTAIN_NOTE
  MOUNTAIN_CONDITIONS
  SNOW_DEPTH_CORRECTED
  UV_VERY_HIGH
  DATA_MISSING
  # Not applicable
  NO_SEA_NEARBY
  NO_SNOW
  # Indoor
  TRAVEL_HINT
  BUSY_HINT
  TOWN_SIZE_LARGE
  TOWN_SIZE_CITY
  TOWN_SIZE_TOWN
  TOWN_SIZE_SMALL
  TOWN_SIZE_NO_DATA
  # Weekly summary
  BEST_DAYS
  NO_GOOD_DAYS
  LOW_CONFIDENCE
  TREND_UP
  TREND_DOWN
  GATE_WARNING
  INDOOR_RECOMMENDED_DAYS
  INDOOR_GOOD_ALTERNATIVE_DAYS
  INDOOR_BUSY_DAYS
  GOOD_OUTDOOR_WEEK
}
